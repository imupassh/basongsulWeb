
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfaf9">
  <title>자수, 염원을 그리다</title>
  <style>
    :root {
      --ink: #1b1b1b;
      --muted: #535353;
      --paper: #fbfaf9;
      --green: #105c55;
      --button-hover-bg: #0b776c;
      --button-active-bg: #084c45;
      --primary-bg: #105c55;
      --primary-text: #fff;
      --focus: #c5451d;
      --scale: 1;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: calc(18px * var(--scale));
      line-height: 1.55;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    :focus-visible { outline: 4px solid var(--focus); outline-offset: 4px; }

    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .skip-links {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 1rem;
      display: flex;
      gap: .5rem;
      transform: translateY(-150%);
    }

    .skip-links:focus-within { transform: translateY(1rem); }

    .skip-links a {
      padding: .65rem .85rem;
      border: 2px solid #111;
      border-radius: 7px;
      background: #fff;
      color: #111;
      font-weight: 800;
    }

    .wrap {
      width: min(100% - 38px, 760px);
      margin-inline: auto;
    }

    header { padding: 28px 0 4px; }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(2rem, 7vw, 2.7rem);
      line-height: 1.18;
      letter-spacing: -.04em;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.35rem, 5vw, 1.8rem);
      line-height: 1.3;
    }

    .top-tools {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .tool-button {
      min-height: 106px;
      padding: 10px 6px;
      border: 3px solid var(--green);
      border-radius: 27px;
      background: var(--paper);
      color: var(--green);
      cursor: pointer;
      font-weight: 850;
      line-height: 1.15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .tool-button.primary {
      background: var(--primary-bg);
      color: var(--primary-text);
    }

    .tool-button svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
      flex: none;
    }

    .tool-button span { font-size: clamp(.8rem, 3.2vw, 1.1rem); }

    .font-and-contrast {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid #c8c5c1;
      border-radius: 14px;
      background: var(--paper);
    }

    .font-and-contrast legend {
      font-size: .83rem;
      font-weight: 800;
      padding: 0 4px;
    }

    .font-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
    }

    .font-options {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 12px;
    }

    .font-options label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      font-size: .82rem;
      cursor: pointer;
    }

    .font-options input {
      width: 20px;
      height: 20px;
      accent-color: var(--green);
    }

    .small-control {
      min-height: 42px;
      padding: 7px 12px;
      border: 1px solid var(--green);
      border-radius: 9px;
      background: var(--paper);
      color: var(--green);
      font-size: .82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .small-control[aria-pressed="true"] {
      background: var(--primary-bg);
      color: var(--primary-text);
    }

    .status {
      min-height: 1.5em;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    main { padding-bottom: 40px; }
    .original-section { margin-top: 26px; }

    .poster-frame { position: relative; }

    .poster-image-button {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .poster-frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    .speaker-hotspot {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: clamp(46px, 10vw, 62px);
      height: clamp(46px, 10vw, 62px);
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--primary-bg);
      color: var(--primary-text);
      box-shadow: 0 2px 8px #003c3740;
      cursor: pointer;
    }

    .speaker-hotspot svg {
      width: 25px;
      height: 25px;
      fill: currentColor;
    }

    .speaker-hotspot.room { left: 22%; top: 4%; }
    .speaker-hotspot.logo { right: 2%; top: 7%; }
    .speaker-hotspot.title { left: 66%; top: 34%; }
    .speaker-hotspot.poster-details { right: 10%; top: 59%; }
    .speaker-hotspot.selected-speaker { top: 12px; left: 12px; }

    .poster-caption {
      margin: 12px 0 0;
      color: var(--muted);
    }

    .poster-caption strong { color: var(--ink); }
    .picker { margin-top: 56px; }

    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .mode-button {
      min-height: 98px;
      padding: 10px 7px;
      border: 2px solid var(--green);
      border-radius: 27px;
      background: var(--paper);
      color: var(--green);
      cursor: pointer;
      font-weight: 850;
      font-size: clamp(.95rem, 4vw, 1.45rem);
    }

    .mode-button[aria-pressed="true"] {
      border-color: var(--primary-bg);
      background: var(--primary-bg);
      color: var(--primary-text);
    }

    .selected-section { margin-top: 26px; }

    .reading-panel {
      margin-top: 22px;
      padding: 18px;
      border-radius: 23px;
      background: var(--primary-bg);
      color: var(--primary-text);
    }

    .reading-panel[hidden] { display: none; }

    .reading-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 7px;
    }

    .reading-state {
      margin: 0;
      color: var(--primary-text);
      font-size: .88rem;
    }

    .reading-pause {
      width: 48px;
      height: 48px;
      flex: none;
      border: 0;
      border-radius: 50%;
      background: var(--primary-text);
      color: var(--primary-bg);
      font-size: .8rem;
      font-weight: 850;
      cursor: pointer;
    }

    .reading-text {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 750;
      white-space: pre-line;
    }

    dialog {
      width: min(96vw, 900px);
      max-width: none;
      max-height: 94vh;
      padding: 16px;
      border: 0;
      border-radius: 18px;
      background: var(--paper);
      color: var(--ink);
    }

    dialog::backdrop { background: #000d; }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .dialog-head h2 { font-size: 1.15rem; }

    .dialog-image {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: calc(94vh - 90px);
      margin: auto;
      object-fit: contain;
    }

    footer {
      padding: 20px 0 34px;
      border-top: 1px solid #d0ccc7;
      color: var(--muted);
      font-size: .82rem;
    }

    @media (max-width: 520px) {
      .wrap { width: min(100% - 30px, 760px); }
      header { padding-top: 24px; }
      .top-tools { gap: 8px; }
      .tool-button { min-height: 88px; border-radius: 24px; border-width: 2px; }
      .tool-button svg { width: 25px; height: 25px; }
      .font-and-contrast { padding: 10px; }
      .font-row { align-items: flex-start; }
      .speaker-hotspot { width: 42px; height: 42px; }
      .speaker-hotspot svg { width: 22px; height: 22px; }
      .picker { margin-top: 42px; }
      .mode-buttons { gap: 8px; }
      .mode-button { min-height: 76px; border-radius: 22px; }
    }

    @media (max-width: 360px) {
      .top-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mode-button { font-size: .9rem; }
    }

    button:not(.poster-image-button) {
      transition: background-color 140ms ease, border-color 140ms ease,
        color 140ms ease, box-shadow 140ms ease, transform 100ms ease;
    }

    @media (hover: hover) {
      button:not(.poster-image-button):hover {
        border-color: var(--button-hover-bg);
        background: var(--button-hover-bg);
        color: var(--primary-text);
        box-shadow: 0 3px 0 var(--button-active-bg);
      }
    }

    button:not(.poster-image-button):active {
      border-color: var(--button-active-bg);
      background: var(--button-active-bg);
      color: var(--primary-text);
      box-shadow: none;
      transform: translateY(2px);
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      button:not(.poster-image-button) { transition: none; }
      button:not(.poster-image-button):active { transform: none; }
    }
  </style>
</head>
<body>
  <nav class="skip-links" aria-label="빠른 이동">
    <a href="#main-content">본문으로 건너뛰기</a>
    <a href="#mode-picker">보기 방식 선택으로 이동</a>
  </nav>

  <header class="wrap">
    <h1 id="page-title">인터랙티브 포스터</h1>
    <div class="top-tools" role="group" aria-label="읽기와 포스터 보기 기능">
      <button class="tool-button primary" id="read-all" type="button" aria-label="현재 내용 모두 읽기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span>모두 읽기</span>
      </button>
      <button class="tool-button" id="stop-reading" type="button" aria-label="읽기 멈추기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        <span>멈추기</span>
      </button>
      <button class="tool-button" id="speed-button" type="button" aria-label="읽기 속도 보통, 누르면 변경">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14l8-7zm9 0v14l8-7z"/></svg>
        <span id="speed-label">빠르기 · 보통</span>
      </button>
      <button class="tool-button" id="zoom-button" type="button" aria-haspopup="dialog" aria-label="현재 포스터 확대">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3L21 22l1-1-5.7-6.1A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm-1 2v3H6v2h3v3h2v-3h3V9h-3V6z"/></svg>
        <span>확대</span>
      </button>
    </div>

    <fieldset class="font-and-contrast">
      <legend>보기 설정</legend>
      <div class="font-row">
        <div class="font-options" role="group" aria-label="글자 크기">
          <label><input type="radio" name="font-size" value="1" checked> 기본</label>
          <label><input type="radio" name="font-size" value="1.18"> 크게</label>
          <label><input type="radio" name="font-size" value="1.36"> 더 크게</label>
        </div>
        <button class="small-control" id="contrast-toggle" type="button" aria-pressed="false">고대비 켜기</button>
      </div>
    </fieldset>

    <p class="status" id="speech-status" role="status" aria-live="polite" aria-atomic="true">스피커 표시를 누르면 해당 부분을 읽어줍니다.</p>
  </header>

  <main class="wrap" id="main-content" tabindex="-1">
    <section class="original-section" aria-labelledby="original-title">
      <h2 class="sr-only" id="original-title">원본 포스터</h2>
      <figure>
        <div class="poster-frame" id="original-frame">
          <button class="poster-image-button" type="button" data-speak="original" aria-label="원본 포스터 전체 그림 설명 듣기">
            <img src="image/original-poster-photo.png" alt="민트색 바탕에 자수로 그린 산과 마을 풍경이 펼쳐진 원본 포스터 사진입니다. 중앙 위쪽에 ‘자수, 염원을 그리다’ 제목과 영문 제목이 있습니다.">
          </button>
          <button class="speaker-hotspot room" type="button" data-speak="room" aria-label="전시 장소 안내 듣기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm12.5 3a3.5 3.5 0 0 0-2-3.16v6.32a3.5 3.5 0 0 0 2-3.16zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          </button>
          <button class="speaker-hotspot logo" type="button" data-speak="museum" aria-label="서울공예박물관 소개 듣기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm12.5 3a3.5 3.5 0 0 0-2-3.16v6.32a3.5 3.5 0 0 0 2-3.16zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          </button>
          <button class="speaker-hotspot title" type="button" data-speak="title" aria-label="전시 제목 및 기획 의도 듣기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm12.5 3a3.5 3.5 0 0 0-2-3.16v6.32a3.5 3.5 0 0 0 2-3.16zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          </button>
          <button class="speaker-hotspot poster-details" type="button" data-speak="posterDetails" aria-label="포스터 이미지 및 분위기 설명 듣기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm12.5 3a3.5 3.5 0 0 0-2-3.16v6.32a3.5 3.5 0 0 0 2-3.16zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          </button>
        </div>
        <figcaption class="poster-caption">
          <strong>원본 포스터</strong> · 스피커 표시를 누르면 해당 부분을 소리로 읽어줘요.
        </figcaption>
      </figure>
    </section>

    <section class="picker" id="mode-picker" tabindex="-1" aria-labelledby="picker-title">
      <h2 id="picker-title">보기 방식 바꾸기</h2>
      <div class="mode-buttons" role="group" aria-label="접근 방식별 포스터 선택">
        <button class="mode-button" type="button" data-mode="lowvision" aria-pressed="false" aria-controls="selected-section">약시</button>
        <button class="mode-button" type="button" data-mode="tunnel" aria-pressed="false" aria-controls="selected-section">터널시야</button>
        <button class="mode-button" type="button" data-mode="colorblind" aria-pressed="false" aria-controls="selected-section">색맹</button>
      </div>
    </section>

    <section class="selected-section" id="selected-section" hidden aria-labelledby="selected-title">
      <h2 class="sr-only" id="selected-title"></h2>
      <figure>
        <div class="poster-frame">
          <img id="selected-image" src="image/poster-contrast.png" alt="">
          <button class="speaker-hotspot selected-speaker" id="selected-speaker" type="button" aria-label="선택한 포스터 설명 듣기" aria-controls="reading-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm12.5 3a3.5 3.5 0 0 0-2-3.16v6.32a3.5 3.5 0 0 0 2-3.16zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          </button>
        </div>
      </figure>
      <div class="reading-panel" id="reading-panel" hidden>
        <div class="reading-bar">
          <p class="reading-state" id="reading-state" role="status" aria-live="polite" aria-atomic="true">선택한 정보</p>
          <button class="reading-pause" id="pause-resume" type="button" aria-label="음성 읽기 일시정지">멈춤</button>
        </div>
        <p class="reading-text" id="reading-text"></p>
      </div>
    </section>
  </main>

  <dialog id="zoom-dialog" aria-labelledby="zoom-title">
    <div class="dialog-head">
      <h2 id="zoom-title">포스터 크게 보기</h2>
      <button class="small-control" id="close-zoom" type="button">닫기</button>
    </div>
    <img class="dialog-image" id="dialog-image" src="image/original-poster-photo.png" alt="원본 포스터 전체 이미지">
  </dialog>

  <footer>
    <div class="wrap">
      <p>음성 읽기는 기기의 브라우저 음성 기능을 사용합니다. 소리가 들리지 않으면 기기 음량과 음성 지원 여부를 확인해 주세요.</p>
    </div>
  </footer>

  <script>
    const modes = {
      lowvision: {
        title: '약시를 위한 포스터',
        image: 'image/poster-contrast.png',
        alt: '민트색 바탕에 큰 검은 글씨로 전시 제목이 있습니다. 가운데에는 붉은색, 남색, 크림색 천 조각으로 표현한 저고리가 있고, 아래쪽에 전시 날짜와 장소가 굵은 글씨로 정리되어 있습니다.',
        descriptionSpeech: [
          '약시를 고려한 맞춤형 포스터예요.',
          '전시 정보를 보다 편안하게 읽으실 수 있도록 글자 크기를 키우고, 제목과 주요 전시 정보를 눈에 잘 띄게 배치했어요.',
          '포스터는 민트색을 배경으로 하며, 중앙에는 한국의 전통 저고리 모양의 그림이 자리하고 있어요. 전시 제목은 크고 굵은 검은색 글씨로 표현되어 있어요.',
          '원본 포스터의 은은한 색감을 유지하면서도 중요한 정보가 돋보이도록 구성했어요.',
        ].join('\n\n')
      },
      tunnel: {
        title: '터널시야를 고려한 포스터',
        image: 'image/poster-low-vision.png',
        alt: '검은색에 가까운 어두운 바탕의 세로형 포스터입니다. 왼쪽의 세로선과 번호를 따라 제목, 상설전시, 날짜와 장소가 밝은 민트색과 노란색 글씨로 이어집니다.',
        descriptionSpeech: [
          '터널시야를 고려한 맞춤형 포스터예요.',
          '좁은 시야에서도 정보를 순서대로 확인하실 수 있도록 어두운 배경에 밝은 글자를 사용하고, 주요 정보를 세로 방향으로 배치했어요.',
          '포스터 왼쪽에는 위에서 아래로 이어지는 선과 번호가 자리하고 있어요. 전시 제목은 민트색으로, 전시 날짜는 노란색으로 강조했어요.',
          '어두운 배경과 밝은 글자의 대비를 활용하고, 일정한 방향으로 정보를 확인할 수 있도록 구성했어요.',
        ].join('\n\n')
      },
      colorblind: {
        title: '색맹 관람객을 위한 포스터',
        image: 'image/poster-braille.png',
        alt: '민트색 세로형 포스터입니다. 위쪽에는 점자와 가로선, 사선, 점무늬 패턴이 있고, 아래쪽에는 전시 정보와 접힌 병풍 모양의 윤곽이 있습니다.',
        descriptionSpeech: [
          '색맹을 고려한 맞춤형 포스터예요.',
          '색상만으로 정보를 구분하지 않도록 글자와 선, 다양한 무늬를 함께 사용했어요.',
          '포스터 위쪽에는 점자 형태의 이미지와 여러 형태의 선, 사선, 점무늬가 배치되어 있어요. 아래쪽에는 주요 전시 정보와 여러 면으로 접힌 병풍 모양의 윤곽선이 자리하고 있어요.',
          '색상뿐만 아니라 형태와 무늬를 통해서도 정보를 구분할 수 있도록 구성했어요.',
          '전시 관람에 관한 문의는 서울공예박물관 대표전화, 02-6450-7000으로 하실 수 있어요.',
        ].join('\n\n')
      }
    };

    const readAllIntroduction = [
      '안녕하세요. 서울공예박물관의 전시, \'자수, 염원을 그리다\'를 소개해 드릴게요.',
      '이번 전시는 서울 종로구 안국동에 위치한 서울공예박물관 전시 3동, 2층 전시실에서 만나보실 수 있어요. 2025년 12월 20일부터 상설전시로 진행되며, 관람료는 무료예요.',
      '전시의 영문 제목은 \'Embroidered Lives, Enduring Wishes\'로, 우리말로 풀어보면 \'수놓은 삶, 오래도록 이어지는 소망\'이라는 뜻이에요.',
      '이번 전시에서는 탄생과 성장, 혼인, 장수, 그리고 죽음 이후의 평안까지 우리 옛사람들이 자수에 담아낸 다양한 소망과 염원을 만나보실 수 있어요.',
      '원본 포스터는 은은한 민트색을 배경으로 하고 있어요. 전시 제목인 \'자수\'는 짙은 보라색의 크고 독특한 글씨로 표현되어 있으며, 배경에는 여러 색의 실로 한 땀 한 땀 수놓은 듯한 산과 마을 풍경이 펼쳐져 있어요.',
      '부드러운 민트색과 깊은 보라색의 조화, 섬세한 자수 풍경이 어우러져 차분하고 고즈넉한 분위기를 자아내요.',
      '화면 아래에서는 약시, 터널시야, 색맹을 고려한 세 가지 맞춤형 포스터를 선택하실 수 있어요. 자신에게 편안한 보기를 선택해 주세요.',
    ].join('\n\n');

    const originalSpeech = {
      original: '원본 포스터입니다. 민트색 바탕 전체에 자수로 그린 산과 마을 풍경이 펼쳐집니다.',
      room: '이번 전시는 서울공예박물관 전시 3동, 2층 전시실에서 만나보실 수 있어요. 2025년 12월 20일부터 상설전시로 진행되며, 관람료는 무료예요.',
      museum: '전시가 열리는 곳은 서울공예박물관이에요. 서울 종로구 안국동에 위치한 공예 전문 박물관으로, 우리나라의 다양한 전통 공예와 현대 공예 작품을 만나보실 수 있어요.',
      title: '이번 전시의 제목은 \'자수, 염원을 그리다\'예요. 영문 제목은 \'Embroidered Lives, Enduring Wishes\'로, 우리말로 풀어보면 \'수놓은 삶, 오래도록 이어지는 소망\'이라는 뜻이에요.\n\n이번 전시에서는 탄생과 성장, 혼인, 장수, 그리고 죽음 이후의 평안까지, 우리 옛사람들이 자수에 담아낸 다양한 소망과 염원을 만나보실 수 있어요.',
      posterDetails: '포스터는 은은한 민트색을 배경으로 하고 있어요. 전시 제목인 \'자수\'는 짙은 보라색의 크고 독특한 글씨로 표현되어 있어요.\n\n배경에는 여러 색의 실로 한 땀 한 땀 수놓은 듯한 산과 마을 풍경이 펼쳐져 있어요. 부드러운 민트색과 깊은 보라색의 조화, 섬세한 자수 풍경이 어우러져 차분하고 고즈넉한 분위기를 자아내요. 한국 전통 자수의 섬세한 아름다움을 느낄 수 있는 포스터예요.'
    };

    const speechStatus = document.querySelector('#speech-status');
    const zoomDialog = document.querySelector('#zoom-dialog');
    const dialogImage = document.querySelector('#dialog-image');
    const selectedSection = document.querySelector('#selected-section');
    const originalFigure = document.querySelector('.original-section figure');
    const selectedFigure = selectedSection.querySelector('figure');
    const readingPanel = document.querySelector('#reading-panel');
    const readingState = document.querySelector('#reading-state');
    const readingText = document.querySelector('#reading-text');
    const readingPause = document.querySelector('#pause-resume');
    const synthesis = window.speechSynthesis;
    readingPause.hidden = !synthesis;
    const fontOptions = Array.from(document.querySelectorAll('input[name="font-size"]'));
    let activeMode = null;
    let speechRate = 1;
    let currentUtterance = null;
    let currentLabel = '선택한 정보';
    const rates = [0.8, 1, 1.2, 1.4];
    const rateNames = ['느리게', '보통', '빠르게', '매우 빠르게'];

    function updatePauseButton(paused) {
      readingPause.textContent = paused ? '계속' : '멈춤';
      readingPause.setAttribute('aria-label', paused ? '음성 읽기 계속하기' : '음성 읽기 일시정지');
    }

    function cancelSpeech() {
      currentUtterance = null;
      synthesis?.cancel();
      updatePauseButton(false);
    }

    function say(text, label, anchor = readingPanel.previousElementSibling) {
      cancelSpeech();
      if (readingPanel.previousElementSibling !== anchor) anchor.after(readingPanel);
      readingPanel.hidden = false;
      readingState.textContent = label;
      readingText.textContent = text;

      if (!synthesis) {
        speechStatus.textContent = '이 브라우저에서는 음성 읽기를 지원하지 않습니다. 화면에 표시된 글을 확인해 주세요.';
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = speechRate;
      currentUtterance = utterance;
      currentLabel = label;

      utterance.onstart = () => {
        if (currentUtterance !== utterance) return;
        speechStatus.textContent = '읽는 중입니다.';
        readingState.textContent = `지금 읽는 중 · ${label}`;
      };

      utterance.onend = () => {
        if (currentUtterance !== utterance) return;
        currentUtterance = null;
        speechStatus.textContent = '읽기가 끝났습니다.';
        readingState.textContent = '읽기가 끝났습니다.';
      };

      synthesis.speak(utterance);
    }

    document.querySelectorAll('[data-speak]').forEach(button => {
      button.addEventListener('click', () => {
        say(originalSpeech[button.dataset.speak], button.getAttribute('aria-label'), originalFigure);
      });
    });

    const toolButtons = document.querySelectorAll('.top-tools .tool-button');
    toolButtons.forEach(button => {
      button.addEventListener('click', () => {
        toolButtons.forEach(tool => tool.classList.toggle('primary', tool === button));
      });
    });

    document.querySelector('#read-all').addEventListener('click', () => {
      say(readAllIntroduction, '전체 포스터', originalFigure);
    });

    document.querySelector('#stop-reading').addEventListener('click', () => {
      cancelSpeech();
      speechStatus.textContent = '읽기를 멈췄습니다.';
      if (!readingPanel.hidden) readingState.textContent = '읽기를 멈췄습니다.';
    });

    readingPause.addEventListener('click', () => {
      if (synthesis?.paused) {
        synthesis.resume();
        updatePauseButton(false);
        readingState.textContent = '읽기를 계속합니다.';
      } else if (synthesis?.speaking) {
        synthesis.pause();
        updatePauseButton(true);
        readingState.textContent = '읽기를 일시정지했습니다.';
      }
    });

    document.querySelector('#speed-button').addEventListener('click', event => {
      const current = rates.indexOf(speechRate);
      const next = (current + 1) % rates.length;
      speechRate = rates[next];

      document.querySelector('#speed-label').textContent = `빠르기 · ${rateNames[next]}`;
      event.currentTarget.setAttribute('aria-label', `읽기 속도 ${rateNames[next]}, 누르면 변경`);

      if (synthesis?.speaking && currentUtterance) {
        say(currentUtterance.text, currentLabel);
        speechStatus.textContent = `읽기 속도를 ${rateNames[next]}로 바꾸고 현재 내용을 처음부터 다시 읽습니다.`;
      } else {
        speechStatus.textContent = `읽기 속도를 ${rateNames[next]}로 바꿨습니다. 다음 읽기부터 적용됩니다.`;
      }
    });

    fontOptions.forEach(option => option.addEventListener('change', () => {
      document.documentElement.style.setProperty('--scale', option.value);
    }));

    document.querySelector('#contrast-toggle').addEventListener('click', event => {
      const enabled = event.currentTarget.getAttribute('aria-pressed') !== 'true';
      event.currentTarget.setAttribute('aria-pressed', String(enabled));

      document.documentElement.style.setProperty('--paper', enabled ? '#000' : '#fbfaf9');
      document.documentElement.style.setProperty('--ink', enabled ? '#fff' : '#1b1b1b');
      document.documentElement.style.setProperty('--muted', enabled ? '#eee' : '#535353');
      document.documentElement.style.setProperty('--green', enabled ? '#75eadb' : '#105c55');
      document.documentElement.style.setProperty('--button-hover-bg', enabled ? '#75eadb' : '#0b776c');
      document.documentElement.style.setProperty('--button-active-bg', enabled ? '#ffdd57' : '#084c45');
      document.documentElement.style.setProperty('--primary-bg', enabled ? '#fff' : '#105c55');
      document.documentElement.style.setProperty('--primary-text', enabled ? '#000' : '#fff');

      event.currentTarget.textContent = enabled ? '고대비 끄기' : '고대비 켜기';
    });

    function updateZoomImage(src, alt) {
      dialogImage.src = src;
      dialogImage.alt = alt;
    }

    document.querySelector('#zoom-button').addEventListener('click', () => {
      if (!activeMode) {
        updateZoomImage('image/original-poster-photo.png', '원본 포스터 전체 이미지');
      }
      zoomDialog.showModal();
    });

    document.querySelector('#close-zoom').addEventListener('click', () => zoomDialog.close());
    zoomDialog.addEventListener('click', event => {
      if (event.target === zoomDialog) zoomDialog.close();
    });

    document.querySelector('.poster-image-button[data-speak="original"]').addEventListener('click', () => {
      updateZoomImage('image/original-poster-photo.png', '원본 포스터 전체 이미지');
    });

    function renderMode(key) {
      activeMode = key;
      const mode = modes[key];

      selectedSection.hidden = false;
      document.querySelector('#selected-title').textContent = mode.title;

      const image = document.querySelector('#selected-image');
      image.src = mode.image;
      image.alt = mode.alt;

      document.querySelectorAll('.mode-button').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.mode === key));
      });

      if (readingPanel.parentElement === selectedSection) {
        cancelSpeech();
        readingPanel.hidden = true;
        readingText.textContent = '';
      }
      speechStatus.textContent = `${mode.title}를 선택했습니다. 스피커 버튼을 누르면 설명을 들을 수 있습니다.`;

      updateZoomImage(mode.image, mode.alt);
    }

    document.querySelectorAll('.mode-button').forEach(button => {
      button.addEventListener('click', () => renderMode(button.dataset.mode));
    });

    document.querySelector('#selected-speaker').addEventListener('click', () => {
      const mode = modes[activeMode];
      say(mode.descriptionSpeech, '포스터 설명', selectedFigure);
    });
  </script>
</body>
</html>
